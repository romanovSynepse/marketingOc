name: SynOC · замер рилсов

# Каждые 3 часа снимает просмотры по всем активным аккаунтам → Supabase.
# Так копятся замеры 6/24/72 ч для «скорости» и отбора outliers.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}   # ручной запуск: Actions → «SynOC · замер рилсов» → Run workflow

concurrency:
  group: synoc-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HIKERAPI_KEY: ${{ secrets.HIKERAPI_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Ключи заданы?
        id: check
        run: |
          if [ -z "$HIKERAPI_KEY" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Секреты ещё не добавлены (infra/README.md, шаг 3) — пропускаю."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Замер
        if: steps.check.outputs.ready == 'true'
        run: python3 infra/collector/synoc_collect.py collect
