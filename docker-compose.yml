version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketingoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./marketing-summary-table-main/db_migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./marketing-summary-table-main/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/marketingoc
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./marketing-summary-table-main
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  traffic-team:
    build: ./traffic-team
    env_file: ./traffic-team/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/marketingoc
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["autopilot"]   # запуск: docker compose --profile autopilot up -d

volumes:
  pgdata:
