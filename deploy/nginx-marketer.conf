# /etc/nginx/sites-available/marketer.syneps.ai
server {
    listen 80;
    server_name marketer.syneps.ai;

    auth_basic "Syneps Marketing";
    auth_basic_user_file /etc/nginx/.htpasswd-marketer;

    location /api/ {
        proxy_pass http://127.0.0.1:8810/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8811;
        proxy_set_header Host $host;
    }
}
